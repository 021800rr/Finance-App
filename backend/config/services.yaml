# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    # Between loading the record and reading the body (priority 300: API Platform's DeserializeProvider).
    App\State\RequestBodyCheckProvider:
        decorates: 'api_platform.state_provider.main'
        decoration_priority: 301
        arguments: [ '@.inner' ]

    # The login throttling of both login firewalls (security.yaml): Symfony's own limiter, built once from the
    # limiters of config/packages/rate_limiter.yaml, so the web form and the API count the attempts together.
    app.login_rate_limiter.symfony:
        class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
        arguments:
            $globalFactory: '@limiter.login_global'
            $localFactory: '@limiter.login_local'
            $secret: '%kernel.secret%'

    App\Security\LoginRateLimiter:
        arguments: [ '@app.login_rate_limiter.symfony' ]

    App\Serializer\ExpectedTypeViolationFactory:
        decorates: 'api_platform.state.denormalization_violation_factory'
        arguments: [ '@.inner' ]

    App\OpenApi\JwtDecorator:
        decorates: 'api_platform.openapi.factory'
        # After LexikJWT (0, the login) and gesdinet (-25, the refresh), before ProblemDetailsDecorator (-100).
        decoration_priority: -50
        arguments: [ '@.inner' ]
        autoconfigure: false

    App\OpenApi\OperationDescriptionMetadataFactory:
        # runs inside the cached factory (priority -10), so the result is cached with the rest of the metadata
        decorates: 'api_platform.metadata.resource.metadata_collection_factory'
        decoration_priority: 0
        arguments: [ '@.inner' ]

    # Stable "errorCode" and "params" (plus "type" derived from the code) on every API error response.
    # A regular normalizer, ahead of API Platform's error normalizers (priority -800/-880) in every format.
    App\Serializer\ProblemNormalizer:
        autoconfigure: false
        tags: [ { name: 'serializer.normalizer', priority: 10 } ]

    App\OpenApi\ProblemDetailsDecorator:
        decorates: 'api_platform.openapi.factory'
        # The outermost one: it also documents what the others add, e.g. LexikJWT's /api/login_check.
        decoration_priority: -100
        arguments: [ '@.inner' ]
        autoconfigure: false
