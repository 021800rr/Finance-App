security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api_login:
            pattern: ^/api/login_check$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # One counter with the web form: a lock there locks the API too (config/packages/rate_limiter.yaml).
            login_throttling:
                limiter: App\Security\LoginRateLimiter

        api:
            pattern: ^/api
            stateless: true
            lazy: true
            provider: app_user_provider
            jwt: ~
            # Without a token the JWT authenticator answers (401 auth.token_missing), as before the refresh.
            entry_point: jwt
            # A new JWT and refresh token for a refresh token (gesdinet_jwt_refresh_token.yaml).
            refresh_jwt:
                check_path: api_token_refresh
                invalidate_token_on_logout: true
            # Logging out deletes the refresh token, blocks the JWT and clears both cookies.
            logout:
                path: api_token_invalidate
                delete_cookies:
                    BEARER:
                        path: /api
                        secure: true
                        samesite: strict

        main:
            lazy: true
            provider: app_user_provider
            # One counter with the API login (config/packages/rate_limiter.yaml).
            login_throttling:
                limiter: App\Security\LoginRateLimiter
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: home
            logout:
                path: /logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/login_check$, roles: PUBLIC_ACCESS }
        # Reachable with an expired JWT: the refresh token is what they check.
        - { path: ^/api/token/(refresh|invalidate)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
