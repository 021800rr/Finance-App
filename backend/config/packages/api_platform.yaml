api_platform:
    title: Finance App API
    version: 1.0.0
    # HEAD answers with the same headers as GET (RFC 9110, section 9.3.2), its ETag among them, so it can be made
    # conditional (ConditionalGetSubscriber). By default API Platform builds no body for HEAD, and with no body it adds
    # neither the ETag nor Vary.
    enable_head_request_optimization: false
    # Every error is plain Problem Details (RFC 9457), whatever the Accept header: as JSON-LD it got "@context",
    # "@id", "@type" and "description", and in application/problem+json the names of extension members SHOULD start
    # with a letter (RFC 9457, section 4). The JSON-LD error also repeated "detail" as "description".
    error_formats:
        jsonproblem: ['application/problem+json']
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    defaults:
        stateless: false
        # A wrong type gets a violation on its field (422) on every property, all of them at once.
        collect_denormalization_errors: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin', 'Cookie']
