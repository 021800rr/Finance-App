name: finance-dev

services:
  postgres:
    image: postgres:16
    container_name: finance-postgres-dev
    restart: unless-stopped
    environment:
      TZ: Europe/Warsaw
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
    ports:
      - "5434:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    command: ["postgres", "-c", "timezone=Europe/Warsaw", "-c", "log_timezone=Europe/Warsaw"]
    # php waits until this check passes, and the first one runs one interval after the start: every second, the stack
    # goes on as soon as the database is up (about a second), not after 5 s. A failure within start_period does not
    # count, so a slow start (a long recovery) is not taken for a broken database. pg_isready only asks whether the
    # server accepts connections. (On Docker 25+, start_interval could keep the 1 s to the start alone.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finance-dev

  php:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: docker/php
    container_name: finance-php-dev
    restart: unless-stopped
    environment:
      PHP_IDE_CONFIG: "serverName=finance-dev"
      TZ: Europe/Warsaw
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./docker/php/timezone.ini:/usr/local/etc/php/conf.d/timezone.ini
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - ./docker/php/memory_limit.ini:/usr/local/etc/php/conf.d/memory_limit.ini
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance-dev

  nginx:
    image: nginx:alpine
    container_name: finance-nginx-dev
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - finance-dev

  node:
    image: node:24-bookworm
    container_name: finance-node-dev
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - node_modules_dev:/var/www/html/node_modules
    # npm install only when package-lock.json differs from the one installed last (a copy kept in node_modules): on
    # every start it asks the npm registry and takes a minute or more.
    command: >-
      sh -c "cmp -s package-lock.json node_modules/.installed-package-lock.json
      || { npm install --no-audit --no-fund && cp package-lock.json node_modules/.installed-package-lock.json; };
      exec npm run watch"
    networks:
      - finance-dev

  # The React front (frontend/): the Vite dev server on http://localhost:5173, passing /api on to nginx.
  front:
    image: node:24-bookworm
    container_name: finance-front-dev
    working_dir: /app
    user: "1000:1000"
    volumes:
      - ./frontend:/app
    # npm install only when package-lock.json changed, as in the node service.
    command: >-
      sh -c "cmp -s package-lock.json node_modules/.installed-package-lock.json
      || { npm install --no-audit --no-fund && cp package-lock.json node_modules/.installed-package-lock.json; };
      exec npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - nginx
    networks:
      - finance-dev

networks:
  finance-dev:
    name: finance-dev-network

volumes:
  node_modules_dev:
    name: finance-dev-node-modules