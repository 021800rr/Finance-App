; opcache.enable=1 // xdebug, testy, pokrycie kodu testami
opcache.enable=0
;opcache.enable_cli=1 ; tests only: `docker compose exec php php -r "var_dump(opcache_get_status());"`
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=128
opcache.max_accelerated_files=10000