server {
    listen 80;
    root /var/www/html/public;
    # The Server header names nginx without its version.
    server_tokens off;

    index index.php;

    # nginx refuses TRACE itself, with a 405 that has no Allow header (RFC 9110, section 15.5.6 requires one), and
    # it refuses other methods on static files the same way. Only the application knows which methods an address
    # supports, so these requests go to Symfony, which answers with the right Allow header.
    error_page 405 = @symfony;

    location @symfony {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
