# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
#
# There used to be an app.main_account_id parameter here (a hardcoded PK).
# It's gone — the main account is now Account::isMain (a DB column, see
# AccountRepository::findMain()/setAsMainAccount()), not a config value that
# assumed the "right" account would always get id 1.

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Serializer\ExpectedTypeViolationFactory:
        decorates: 'api_platform.state.denormalization_violation_factory'
        arguments: [ '@.inner' ]

    App\OpenApi\JwtDecorator:
        decorates: 'api_platform.openapi.factory'
        arguments: [ '@.inner' ]
        autoconfigure: false

    App\OpenApi\OperationDescriptionMetadataFactory:
        # runs inside the cached factory (priority -10), so the result is cached with the rest of the metadata
        decorates: 'api_platform.metadata.resource.metadata_collection_factory'
        decoration_priority: 0
        arguments: [ '@.inner' ]

    # Stable "errorCode" and "params" (plus "type" derived from the code) on every API error response.
    # A regular normalizer, ahead of API Platform's error normalizers (priority -800/-880) in every format.
    App\Serializer\ProblemNormalizer:
        autoconfigure: false
        tags: [ { name: 'serializer.normalizer', priority: 10 } ]

    App\OpenApi\ProblemDetailsDecorator:
        decorates: 'api_platform.openapi.factory'
        arguments: [ '@.inner' ]
        autoconfigure: false
